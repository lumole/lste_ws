# One configuration file for fair fixed-goal controller comparisons.
# Edit CONTROLLER_METHOD, then run `rltest` again.

WORLD: worlds/topo3.0_catch_mode/session_test/env04_no_pro3.world
GUI: true

# Robot pose in Gazebo world coordinates. INITIAL_YAW is radians.
INITIAL_X: 15.79
INITIAL_Y: -8.45
INITIAL_Z: 0.1
INITIAL_YAW: -1.57079632679

# Default target. During a running GUI test, Shift + left-click replaces it.
GOAL_X: 12.95
GOAL_Y: -6.51
ALLOW_GAZEBO_CLICK_GOAL: true

# Select exactly one controller:
# - teb: online SLAM + Navfn global planner + TEB local planner.
# - dwa: online SLAM + Navfn global planner + DWA local planner.
# - rl:  SA-PPO controller, without move_base or a global map planner.
CONTROLLER_METHOD: teb

# Shared forward-speed setting for TEB and DWA, in m/s.
NAVIGATION_MAX_LINEAR_SPEED: 1.00

# Used only when CONTROLLER_METHOD is rl. Values are the existing SA-PPO modes:
# policy_only, stabilized_recovery, rl_dwa_guard, rl_mppi_guard, rl_grid_guard.
RL_CONTROLLER_MODE: rl_grid_guard
SAPPO_SPEED: 0.50

ROS_PORT: 11312
GAZEBO_PORT: 11346
# Number of days to retain timestamped log directories.
LOG_RETENTION_DAYS: 15
