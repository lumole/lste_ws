# Benchmark-only pipeline overrides. Production defaults remain unchanged.
WORLD: worlds/benchmark/office_building_v1_level_2_no_pro3.world
TASK_JSON: model/Data_exchange/vlm_prompt/lab/yellow_cup.json
TASK_ID: yellow_cup

# The launcher replaces these four values from the selected robot profile.
# Select it with OFFICE_BUILDING_PROFILE=target_entry when invoking
# run_office_building.sh; target_entry is diagnostic-only and bypasses
# exploration, so its run must not enter the final benchmark aggregate.
PRO3_SPAWN_X: 2.8
PRO3_SPAWN_Y: 11.0
PRO3_SPAWN_Z: 0.1
PRO3_SPAWN_YAW: 0.0

GLOBAL_GOAL_SOURCE: brain
ONLINE_SLAM_ENABLED: true
GLOBAL_FRONTIER_ENABLED: true
# Full graph-first method by default. `experiment_matrix.yaml` changes this
# named contract for baselines or the `place_portal_workitem_strict` ablation;
# the method switch does not alter world, detector, controller, or navigation
# gains. The full method may branch around a local candidate only when its
# viewpoint lacks durable geometry; rehydratable WorkItems close their Place
# before a Portal crossing. `place_portal_workitem_legacy_rank` isolates the
# old scalar local selector while retaining the same Place/Portal/WorkItem graph.
# gains between trials.
GLOBAL_FRONTIER_METHOD: place_portal_workitem
LEGACY_GP_FRONTIER_ENABLED: false
LSTE_CONTROLLER: teb
CONTROLLER_MODE: teb
DETECTOR: wedetect-large

# The production benchmark uses one persistent Navfn/TEB mission lease. Place
# graph events still own every portal/work-item transition, but ordinary
# frontier updates are admitted as route revisions inside the same action.
# This removes the artificial stop/restart at every short frontier endpoint;
# endpoint_action remains available for an explicit A/B comparison run.
TEB_EXECUTION_ARCHITECTURE: persistent_stream
GLOBAL_FRONTIER_MISSION_ENDPOINT_ONLY: true
GLOBAL_FRONTIER_LOOKAHEAD_DISTANCE: 4.0
GLOBAL_FRONTIER_WAYPOINT_RELEASE_RADIUS: 1.20
TEB_FRONTIER_OBSERVATION_COMPLETION_RADIUS: 0.0
TEB_CONTROLLER_FREQUENCY: 20.0
TEB_MAX_LINEAR_SPEED: 0.5
TEB_MAX_VEL_THETA: 0.65
TEB_MIN_OBSTACLE_DIST: 0.22
TEB_INFLATION_DIST: 0.55
TARGET_APPROACH_STRATEGY: reachable_viewpoint_ladder
TARGET_ROUTE_CONTINUITY_ENABLED: true
TARGET_ROUTE_CONTINUITY_DEFER_SHARP_TAKEOVER: true
TARGET_REACQUIRE_DURATION: 12.0

# Simulator-only target truth evaluation. It never publishes a command.
TARGET_EVAL_ENABLED: true
TARGET_EVAL_GAZEBO_TARGET_MODEL: cup_yellow
TARGET_EVAL_GAZEBO_ROBOT_MODEL: pro3
TARGET_EVAL_WORLD_FRAME: world
TARGET_EVAL_ODOM_FRAME: odom
TARGET_EVAL_CAMERA_FRAME: kinect_rgb_optical_frame
TARGET_EVAL_CAMERA_INFO_TOPIC: /kinect/hd/camera_info
TARGET_EVAL_TARGET_LABELS: "yellow cup,yellow mug"
# The benchmark include scales the source cup by 1.8. Its measured visual
# bounds are approximately 0.147 x 0.147 x 0.138 m, with the origin at the
# base. These values are observer-only truth for projected-box diagnostics.
TARGET_EVAL_TARGET_CENTER_M: "0,0,0.069"
TARGET_EVAL_TARGET_SIZE_M: "0.147,0.147,0.138"
# The Pro3 Kinect description in this workspace publishes RGB and CameraInfo,
# but does not instantiate a depth sensor. Keep this optional truth check off
# instead of treating a non-existent compressedDepth topic as a detector
# failure. Target completion still uses detector evidence and approach state.
TARGET_EVAL_DEPTH_ENABLED: false

LOG_RETENTION_DAYS: 15
